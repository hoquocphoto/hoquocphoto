# Keeps each album in step with its folder, albums/<album>/: photos uploaded there
# are resized and added, photos deleted there leave the album. Then the site is
# rebuilt and published. Editing albums.json (captions, order) also republishes.
name: Add photos and publish

on:
  push:
    branches: [main]
    paths: ["albums/**", "albums.json", "template.html", "build.py", "tools/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: add-photos
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install image tools
        run: pip install Pillow==12.0.0 pillow-heif==1.0.0

      - name: Match albums to their folders
        run: python tools/sync_albums.py

      - name: Rebuild the page
        run: python build.py

      - name: Save to the site
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git commit -m "Update albums from their folders and rebuild the site"
          git pull --rebase --quiet
          git push
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Pages
        if: steps.save.outputs.pushed == '1' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages will rebuild on its own."
